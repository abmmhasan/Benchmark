worker_processes auto;
pid /tmp/benchmark-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    client_body_temp_path /tmp/benchmark-client-body;
    proxy_temp_path /tmp/benchmark-proxy;
    fastcgi_temp_path /tmp/benchmark-fastcgi;
    uwsgi_temp_path /tmp/benchmark-uwsgi;
    scgi_temp_path /tmp/benchmark-scgi;

    upstream hyperf {
        server 127.0.0.1:9501;
        keepalive 64;
    }

    upstream infbyte {
        server 127.0.0.1:9502;
        keepalive 64;
    }

    upstream infbyte_full {
        server 127.0.0.1:9503;
        keepalive 64;
    }

    upstream webrick_sharded {
        server 127.0.0.1:9504;
        keepalive 64;
    }

    upstream webrick_fused {
        server 127.0.0.1:9505;
        keepalive 64;
    }

    upstream laravel {
        server 127.0.0.1:9506;
        keepalive 64;
    }

    upstream laravel_api {
        server 127.0.0.1:9507;
        keepalive 64;
    }

    upstream symfony {
        server 127.0.0.1:9508;
        keepalive 64;
    }

    server {
        listen 9500;
        server_name 127.0.0.1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;

        location = /libs/php_config.php {
            proxy_pass http://hyperf;
        }

        location = /libs/php_disable_functions.php {
            proxy_pass http://hyperf;
        }

        location /hyperf/ {
            proxy_pass http://hyperf;
        }

        location ~ ^/infbyte/asset/public/index\.php(/.*)$ {
            rewrite ^/infbyte/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://infbyte;
        }

        location ~ ^/infbyte-full/asset/public/index\.php(/.*)$ {
            rewrite ^/infbyte-full/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://infbyte_full;
        }

        location ~ ^/webrick-sharded/asset/public/index\.php(/.*)$ {
            rewrite ^/webrick-sharded/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://webrick_sharded;
        }

        location ~ ^/webrick-fused/asset/public/index\.php(/.*)$ {
            rewrite ^/webrick-fused/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://webrick_fused;
        }

        location ~ ^/laravel/asset/public/index\.php(/.*)$ {
            rewrite ^/laravel/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://laravel;
        }

        location ~ ^/laravel-api/asset/public/index\.php(/.*)$ {
            rewrite ^/laravel-api/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://laravel_api;
        }

        location ~ ^/symfony/asset/public/index\.php(/.*)$ {
            rewrite ^/symfony/asset/public/index\.php(/.*)$ $1 break;
            proxy_pass http://symfony;
        }
    }
}
