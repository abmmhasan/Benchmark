name: Framework benchmarks

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-benchmarks
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.title }} benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: opcache
            title: OPcache + Apache
            container: benchmark-frameworks-apache
          - runtime: fpm
            title: PHP-FPM + Nginx
            container: benchmark-frameworks-fpm
          - runtime: swoole
            title: Swoole
            container: benchmark-frameworks-swoole
          - runtime: frankenphp
            title: FrankenPHP
            container: benchmark-frameworks-frankenphp
          - runtime: roadrunner
            title: RoadRunner
            container: benchmark-frameworks-roadrunner
          - runtime: workerman
            title: Workerman
            container: benchmark-frameworks-workerman

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install benchmark dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate latest stable applications
        run: composer benchmark:frameworks -- setup --runtime=${{ matrix.runtime }} --force

      - name: Start runtime server
        run: composer benchmark:frameworks -- docker --runtime=${{ matrix.runtime }}

      - name: Validate framework targets
        run: composer benchmark:frameworks -- check --runtime=${{ matrix.runtime }}

      - name: Run complete benchmark suite
        run: composer benchmark:frameworks -- run --runtime=${{ matrix.runtime }} --output=docs/${{ matrix.runtime }} --repetitions=2 --stability=10 --history-limit=61 --replace-monthly

      - name: Show runtime server errors
        if: failure()
        run: docker logs --tail 300 ${{ matrix.container }} || true

      - name: Stop runtime server
        if: always()
        run: |
          if [[ -f frameworks/.benchmark-server.json ]]; then
            composer benchmark:frameworks -- docker-stop \
              || docker rm --force ${{ matrix.container }} 2>/dev/null \
              || true
          else
            docker rm --force ${{ matrix.container }} 2>/dev/null || true
          fi
          rm -f frameworks/.benchmark-server.json

      - name: Package runtime report
        run: tar -cf benchmark-${{ matrix.runtime }}.tar -C docs ${{ matrix.runtime }}

      - name: Upload runtime report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.runtime }}
          path: benchmark-${{ matrix.runtime }}.tar
          retention-days: 7

  publish:
    name: Propose benchmark reports
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
          tools: composer:v2

      - name: Install benchmark dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download runtime reports
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: benchmark-artifacts

      - name: Merge reports and rebuild archive
        run: |
          for report in benchmark-artifacts/*/*.tar; do
            tar -xf "$report" -C docs
          done
          composer benchmark:frameworks -- archive-index --output=docs

      - name: Open or update benchmark results pull request
        id: results-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/framework-benchmark-results
          delete-branch: true
          add-paths: docs
          commit-message: 'docs: update framework benchmark reports'
          title: 'docs: update framework benchmark reports'
          body: |
            Automated PHP framework benchmark results for all six runtime profiles.

            Generated by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

      - name: Add pull request to workflow summary
        if: steps.results-pr.outputs.pull-request-number != ''
        env:
          RESULTS_PR_NUMBER: ${{ steps.results-pr.outputs.pull-request-number }}
          RESULTS_PR_URL: ${{ steps.results-pr.outputs.pull-request-url }}
          RESULTS_PR_OPERATION: ${{ steps.results-pr.outputs.pull-request-operation }}
        run: |
          echo "### Benchmark results pull request" >> "$GITHUB_STEP_SUMMARY"
          echo "PR [#${RESULTS_PR_NUMBER}](${RESULTS_PR_URL}) was ${RESULTS_PR_OPERATION}." >> "$GITHUB_STEP_SUMMARY"
